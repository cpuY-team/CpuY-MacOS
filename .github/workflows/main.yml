name: main

on:
  workflow_dispatch:
  push:
    paths:
      - '**.swift'
      - 'cpuY.xcodeproj/**'
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Build (Release)
        run: |
          xcodebuild \
            -project cpuY.xcodeproj \
            -scheme cpuY \
            -configuration Release \
            -derivedDataPath /tmp/cpuY_build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="x86_64 arm64" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign & zip
        run: |
          APP="/tmp/cpuY_build/Build/Products/Release/cpuY.app"
          codesign --deep --force --sign - "$APP"
          ditto -c -k --keepParent "$APP" /tmp/cpuY.zip

      - name: Compute next version tag
        id: version
        run: |
          HIGHEST=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "import sys,json; [print(r['tag_name']) for r in json.load(sys.stdin)]" \
            | grep -E '^v0\.[0-9]+$' \
            | grep -oE '[0-9]+$' \
            | sort -n \
            | tail -1)
          NEXT_TAG="v0.$((HIGHEST + 1))"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Next release tag: $NEXT_TAG"

      - name: Create GitHub Release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          printf 'Automated build from %s @ %s\n\n### Install\n1. Download cpuY.zip and unzip it\n2. Move cpuY.app to /Applications\n3. Right-click the app then Open (bypasses Gatekeeper)\n\nOr strip quarantine:\n    xattr -dr com.apple.quarantine /Applications/cpuY.app\n\n### Requirements\nmacOS 12 Monterey or later\n' \
            "$GITHUB_REF_NAME" "$SHORT_SHA" > /tmp/release_notes.md

          python3 -c "import json,os; body=open('/tmp/release_notes.md').read(); tag=os.environ['NEXT_TAG']; open('/tmp/release_payload.json','w').write(json.dumps({'tag_name':tag,'name':'cpuY '+tag,'body':body}))"

          RELEASE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            --data-binary @/tmp/release_payload.json)

          echo "$RELEASE" | python3 -c "import sys,json; r=json.load(sys.stdin); print('Release:', r.get('html_url','no url'))"

          UPLOAD_URL=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'])" | sed 's/{?name,label}//')

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/zip" \
            "${UPLOAD_URL}?name=cpuY.zip&label=cpuY.zip" \
            --data-binary @/tmp/cpuY.zip \
            | python3 -c "import sys,json; print('Asset:', json.load(sys.stdin).get('browser_download_url','ERROR'))"
